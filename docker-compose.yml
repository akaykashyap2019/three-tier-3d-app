version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: app_database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./server
    container_name: app_backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "postgresql://postgres:password123@database:5432/app_db?schema=public"
    depends_on:
      - database

  frontend:
    build: ./client
    container_name: app_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata: